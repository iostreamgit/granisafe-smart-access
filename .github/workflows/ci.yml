name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Testcontainers Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @granisafe/api prisma:generate

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: granisafe
          POSTGRES_PASSWORD: granisafe
          POSTGRES_DB: granisafe_smart_access
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U granisafe -d granisafe_smart_access"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://granisafe:granisafe@localhost:5433/granisafe_smart_access
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long
      AI_ADAPTER: fake
      API_PORT: '3000'
      CORS_ORIGINS: http://127.0.0.1:5173
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      PLAYWRIGHT_SKIP_WEBSERVER: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @granisafe/shared build && pnpm --filter @granisafe/api build

      - name: Migrate + seed
        run: pnpm db:setup

      - name: Start API
        run: |
          pnpm --filter @granisafe/api start:prod > /tmp/api.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:3000/health -t 90000

      - name: Start web
        run: |
          pnpm --filter @granisafe/web exec vite --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:5173 -t 90000

      - name: Install Playwright Chromium
        run: pnpm --filter @granisafe/web test:e2e:install

      - name: E2E
        run: pnpm test:e2e

  ai-syntax:
    name: AI service import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI dependencies
        run: pip install -r apps/ai-service/requirements.txt

      - name: Import app
        working-directory: apps/ai-service
        run: python -c "from app.main import app; print(app.title)"
