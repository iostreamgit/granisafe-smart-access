# Optional overlays for local development.
# Usage:
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  minio:
    ports:
      - '9000:9000'
      - '9001:9001'
